# G9209: 充电器不再限流 500mA
#
# 驱动默认 safe_bringup=true，会把输入限流和快充电流都压到 500mA：
#   max77843-charger.c:325  static bool safe_bringup = true;
#   max77843-charger.c:723  bool cap500 = safe_bringup && !force_full;
# 本机实测：500mA 输入时系统净放电 -860mA，跑重负载会掉到 UVLO 直接硬复位
# （表现为"崩溃"但 pstore 里没有 panic —— 不是内核 panic，是电源域复位）。
#
# 关掉 safe_bringup 后 input=1800mA / fast=2100mA。
# 注意：还需要 echo 1 > /sys/module/max77843_charger/parameters/charge_enable
#       驱动默认 charge_enable=0 是只读模式，不会真的打开 CHG_EN。
options max77843_charger safe_bringup=0
