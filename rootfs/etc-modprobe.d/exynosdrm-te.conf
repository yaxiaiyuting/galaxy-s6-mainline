# G9209: 开启 DECON i80 TE 同步，消除画面撕裂
#
# TE 信号路径（五条证据互锁，详见 文档/05-专项/TE同步实现-20261024.md）：
#   面板 S6E3HF2 TE 引脚 → SoC 焊盘 GPG0[0] → pinctrl_bus0(0x13470000) EINT
#   → GIC SPI 383 → irq 69 "drm_decon_te"
#
# 验证：mainline pinctrl 偏移算法 0x13470000 + 0xA00 + 0x34 = 0x13470A34
#       与 vendor DTS 的 te_eint reg[0] 逐位吻合（EMASK 同理 = 0x13470934）
#
# 实测：TE 中断稳定 60 次/秒，与面板 1440x2560@60 精确匹配
#
# te_sync=1 → decon_atomic_flush() 等 TE 中断再写 SWTRIGCMD
#             （40ms 兜底定时器：TE 断流时退回旧行为，不会黑屏/卡死）
options exynosdrm te_sync=1 te_debug=1
