<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    G9209 中文字形修正 + 等宽字体修正

    【历史坑】第一版规则写成：
        <match target="pattern">
          <test name="lang" compare="contains"><string>zh</string></test>
          <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK SC</string>
          </edit>
        </match>
    因为系统 LANG=zh_CN.UTF-8，fc-match 默认带 lang=zh，
    这条规则会对**所有**字体请求生效 —— 包括 "DejaVu Sans Mono"
    这种明确指定的等宽字体。结果整个系统的字体全被替换成
    比例字体 Noto Sans CJK SC，终端里字母间距巨大（看起来像吞字）。

    【修正】必须用 `family compare="eq"` 精确限定到 generic family，
    这样只影响 "sans-serif" / "monospace" 这些通用名，不影响
    用户显式指定的具体字体。
  -->

  <!-- zh 语言的 sans-serif 优先简体字形 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- zh 语言的 serif 优先简体字形 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- monospace：拉丁用真正的等宽字体，中文再回退 -->
  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <!--
    sans-serif 的 pref 不再无条件塞 Noto Sans CJK SC。
    上面已经用 lang=zh 的 match 精确处理了中日韩场景；
    这里只做弱别名，让英文环境仍用系统默认的 sans 字体。
  -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
