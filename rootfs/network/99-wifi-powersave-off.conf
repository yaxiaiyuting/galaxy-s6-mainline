[connection]
# G9209: brcmfmac 固件在省电模式下会周期性崩溃
#
# 症状：
#   kernel: ieee80211 phy0: brcmf_msgbuf_query_dcmd: Timeout on response for query command
#   kernel: ieee80211 phy0: brcmf_set_pmk: failed to change PSK in firmware (len=0)
#   iw dev wlp1s0 link  → command failed: Input/output error (-5)
#   NetworkManager 仍显示 connected、IP 仍在，但实际完全不转发流量，SSH 无响应
#   只能重启恢复（19-30 分钟就复发一次）
#
# 修复：关闭 WiFi 省电模式
#   2 = disable（0 = 用默认，1 = 启用，3 = 由驱动决定）
wifi.powersave = 2
